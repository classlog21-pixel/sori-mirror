name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'lang/**', 'app/**', '.github/workflows/android-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 실행할 때마다 1씩 올라가는 빌드 번호를 앱 버전 번호(versionCode)로 사용
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install and sync web app
        working-directory: app
        run: |
          npm ci || npm install
          npm run sync
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
      - name: Build test APK and store AAB
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: sori-mirror-test-apk-v${{ github.run_number }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sori-mirror-store-aab-v${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/app-release.aab
