# Codemagic iOS 빌드 설정 (Capacitor 앱은 app/ 폴더, iOS 프로젝트는 app/ios)
workflows:
  # 1) 애플 개발자 계정 없이 iOS 코드가 빌드되는지만 확인 (서명 없음, 설치 불가)
  ios-check:
    name: iOS build check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install and sync web app
        working_directory: app
        script: |
          npm ci || npm install
          npm run sync:ios
      - name: Build without signing
        working_directory: app/ios/App
        script: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

  # 2) 서명된 IPA를 만들어 TestFlight에 업로드
  #    준비물: Codemagic Teams > Integrations 에 App Store Connect API 키를
  #    "SORI ASC" 이름으로 등록하고, Code signing identities 에서
  #    com.classlog.sorimirror 용 배포 인증서와 App Store 프로비저닝 프로파일을 받아둘 것
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: SORI ASC
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.classlog.sorimirror
    scripts:
      - name: Install and sync web app
        working_directory: app
        script: |
          npm ci || npm install
          npm run sync:ios
      - name: Apply signing profiles
        script: xcode-project use-profiles --project app/ios/App/App.xcodeproj
      - name: Set build number
        working_directory: app/ios/App
        # Codemagic 빌드 번호(매번 1씩 증가)를 iOS 빌드 번호로 사용
        script: agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: xcode-project build-ipa --project app/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
